services:
  jockiefluxer:
    build: .
    image: jockiefluxer:latest
    container_name: jockiefluxer
    restart: unless-stopped
    env_file: .env
    volumes:
      # Saved playlists, favourites and per-server settings.
      - ./data:/app/data
      # Optional: YouTube cookies for age-gated tracks and to avoid bot
      # checks. Deliberately NOT mounted :ro — yt-dlp writes renewed
      # session cookies back to this same file after every request, which
      # is what keeps a cookiefile working for weeks without you manually
      # re-exporting it. A read-only mount silently breaks that (and, if
      # genuinely read-only, breaks playback outright). The entrypoint
      # fixes ownership on start, same as it does for ./data.
      # - ./cookies.txt:/config/cookies.txt
    # Uncomment if you're running the PO token provider below - lets
    # YTDLP_POT_PROVIDER_URL use the service name instead of an IP. Note
    # this only guarantees Compose *starts* bgutil-pot-provider first, not
    # that its server is accepting connections yet — the image ships no
    # HEALTHCHECK for a stronger `condition: service_healthy` to wait on.
    # jockiefluxer's own startup check retries for this, so a "Connection
    # refused" in the very first few seconds of `docker compose up` is a
    # normal cold-start race, not a misconfiguration - it resolves itself.
    # depends_on:
    #   - bgutil-pot-provider

  # PO token provider — only needed if YouTube still blocks you with "Sign
  # in to confirm you're not a bot" or "Requested format is not available"
  # after YTDLP_COOKIEFILE is correctly set (see README). Common on
  # datacenter/VPS IPs, which YouTube flags harder than home connections.
  # Uncomment this and set YTDLP_POT_PROVIDER_URL=http://bgutil-pot-provider:4416
  # in .env.
  #
  # bgutil-pot-provider:
  #   image: brainicism/bgutil-ytdlp-pot-provider
  #   container_name: bgutil-pot-provider
  #   restart: unless-stopped
  #   # No ports: needed — jockiefluxer reaches it over the compose network
  #   # by service name, nothing outside this compose file needs to see it.

  # Jockie users are used to running Jockie Music 2, 3, … alongside the first
  # so several parties can listen to different things. Each extra instance is
  # a separate bot account with its own token, prefix and data volume.
  #
  # jockiefluxer-2:
  #   build: .
  #   image: jockiefluxer:latest
  #   container_name: jockiefluxer-2
  #   restart: unless-stopped
  #   env_file: .env.second
  #   environment:
  #     BOT_PREFIX: "mm!"
  #   volumes:
  #     - ./data-2:/app/data
