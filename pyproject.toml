[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jockiefluxer"
version = "1.0.0"
description = "A drop-in replacement for the Jockie Music Discord bot, built for self-hosted Fluxer instances."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fluxer.py[voice]>=0.4.2",
    # [default] pulls in yt-dlp-ejs, the JS scripts that solve YouTube's "n"
    # signature challenge. Without them, most formats silently disappear
    # ("Requested format is not available") regardless of cookies or a PO
    # token - a JS runtime (Deno, installed separately - see Dockerfile)
    # still has to actually be present for these to run.
    "yt-dlp[default]>=2024.1.1",
    "aiohttp>=3.9.0",
    # Self-registers as a yt-dlp PO-token provider plugin (no integration code
    # needed here). A no-op unless YTDLP_POT_PROVIDER_URL points it at a
    # running bgutil-ytdlp-pot-provider server - see README.
    "bgutil-ytdlp-pot-provider>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jockiefluxer = "jockiefluxer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jockiefluxer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
