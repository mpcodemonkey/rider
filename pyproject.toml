[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jockiefluxer"
version = "1.0.0"
description = "A drop-in replacement for the Jockie Music Discord bot, built for self-hosted Fluxer instances."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fluxer.py[voice]>=0.4.2",
    "yt-dlp>=2024.1.1",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jockiefluxer = "jockiefluxer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jockiefluxer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
